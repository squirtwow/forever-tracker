name: Forever tracker

# Every 15 minutes: checks Blizzard's patch server, the Blizzard UI source
# mirror and the Blizzard forums for WoW Forever changes, and posts anything new
# to the staff Discord channel. Run it by hand from the Actions tab; tick
# "Dry run" to print the messages in the log instead of posting them.
on:
  schedule:
    - cron: '7,22,37,52 * * * *' # off the hour; scheduled runs can start late
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print the messages instead of posting them, and save nothing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # only to tell a lost state from the very first run

concurrency:
  group: forever-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest saved state. Each run saves under its own key, because a
      # cache can't be overwritten; the prefix finds the latest one.
      - name: Restore saved state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: forever-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forever-tracker-state-

      - name: Check for Forever changes
        run: node src/tracker.mjs
        env:
          FOREVER_TRACKER_WEBHOOK: ${{ secrets.FOREVER_TRACKER_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          STATE_FILE: .state/state.json
          FOREVER_PRODUCTS: ${{ vars.FOREVER_PRODUCTS }}
          INCLUDE_KNOWN_ISSUES: ${{ vars.INCLUDE_KNOWN_ISSUES }}
          PING_ROLE_ID: ${{ vars.PING_ROLE_ID }}
          WATCH_ADDONS: ${{ vars.WATCH_ADDONS }}

      - name: Save state
        if: always() && inputs.dry_run != true && hashFiles('.state/state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: forever-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
